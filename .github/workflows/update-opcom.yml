name: Actualizare date OPCOM

on:
  schedule:
    - cron: "17 15 * * *"
      timezone: "Europe/Bucharest"
  workflow_dispatch:

permissions:
  contents: write           # necesar ca job-ul să poată face commit în repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul din repo
        uses: actions/checkout@v7

      - name: Configurează Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalează dependențele
        run: pip install requests

      - name: Rulează scraperul pentru anul curent
        run: |
          for attempt in 1 2 3; do
            if python opcom_scrapper.py; then
              exit 0
            fi
            echo "Incercarea $attempt a esuat."
            if [ "$attempt" -lt 3 ]; then
              echo "Astept 60s inainte de reincercare..."
              sleep 60
            fi
          done
          exit 1

      - name: Salvează fișierul actualizat (dacă s-a schimbat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/opcom_*.csv
          if git diff --cached --quiet; then
            echo "Nicio schimbare în date - nu fac commit."
          else
            git commit -m "Actualizare automata date OPCOM ($(date -u +%F))"
            git push
          fi